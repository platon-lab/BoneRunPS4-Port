name: Control - OpenOrbis hello_world

on:
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-24.04
    container:
      image: openorbisofficial/toolchain:latest
      options: --user root
    env:
      OO_PS4_TOOLCHAIN: /lib/OpenOrbisSDK
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git zip clang lld python2.7
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/oo
          cp -r /tmp/oo/samples/hello_world /tmp/hello_world
          cp /tmp/oo/samples/piglet/sce_sys/about/right.sprx /tmp/hello_world/sce_sys/about/right.sprx

      - name: Build hello_world PKG (официальный Makefile из samples)
        working-directory: /tmp/hello_world
        run: |
          make || true
          ls -la
          ls -la $(find . -name "*.pkg" -o -name "eboot.bin") 2>/dev/null || true

      - name: Upload hello_world output
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-control
          path: /tmp/hello_world
          if-no-files-found: warn
