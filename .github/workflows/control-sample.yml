name: Control - OpenOrbis hello_world

on:
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-24.04
    container:
      image: openorbisofficial/toolchain:latest
      options: --user root
    env:
      OO_PS4_TOOLCHAIN: /lib/OpenOrbisSDK
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git zip clang lld python2.7
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/oo
          cp -r /tmp/oo/samples /tmp/samples
          cp /tmp/oo/samples/piglet/sce_sys/about/right.sprx /tmp/samples/hello_world/sce_sys/about/right.sprx

      - name: Install wrappers for missing create-fself / create-gp4
        run: |
          cp "$GITHUB_WORKSPACE/tools/oo-wrappers/create-fself" "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
          cp "$GITHUB_WORKSPACE/tools/oo-wrappers/create-gp4" "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
          chmod +x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself" "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
          ls -la "$OO_PS4_TOOLCHAIN/bin/linux/"

      - name: Build hello_world PKG (официальный Makefile из samples)
        working-directory: /tmp/samples/hello_world
        run: |
          make
          ls -la
          find . -name "*.pkg" -o -name "eboot.bin"

      - name: Upload hello_world output
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-control
          path: /tmp/samples/hello_world
          if-no-files-found: warn
