name: Build Bone Run

on:
  push:
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run game logic tests
        run: make test

  build-ps4:
    needs: test-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld make git zip
      - name: Get OpenOrbis PS4 toolchain
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git "$HOME/ps4tc"
          echo "OO_PS4_TOOLCHAIN=$HOME/ps4tc" >> "$GITHUB_ENV"
      - name: Build eboot and package folder
        run: make package
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: bone-run-ps4
          path: dist/bone-run-ps4.zip
