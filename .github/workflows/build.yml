name: Build Bone Run

on:
  push:
  workflow_dispatch:

env:
  TITLE_ID: TITO00001
  CONTENT_ID: UP0001-TITO00001_00-BONERUN000000001

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run game logic tests
        run: make test

  build-ps4:
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: openorbisofficial/toolchain:latest
      options: --user root
    env:
      OO_PS4_TOOLCHAIN: /lib/OpenOrbisSDK
    steps:
      - uses: actions/checkout@v4

      - name: Install python3 for tools
        run: |
          apt-get update
          apt-get install -y python3 zip

      - name: Generate param.sfo and icon0.png
        run: |
          python3 tools/make_sfo.py
          python3 tools/make_icon.py

      - name: Install clang and lld if missing
        run: |
          if ! command -v clang >/dev/null 2>&1 || ! command -v ld.lld >/dev/null 2>&1; then
            apt-get update
            apt-get install -y clang lld
          fi
          clang --version
          ld.lld --version | head -1
          echo "Toolchain dir: $OO_PS4_TOOLCHAIN"
          ls "$OO_PS4_TOOLCHAIN" || true
          ls "$OO_PS4_TOOLCHAIN/bin/linux" || true

      - name: Install python2.7 (make_fself.py из OpenOrbis написан под Python 2)
        run: |
          apt-get update
          apt-get install -y python2.7
          python2.7 --version

      - name: Build eboot.bin (как в samples/hello_world/Makefile)
        run: |
          set -e
          T="$OO_PS4_TOOLCHAIN"
          mkdir -p build/ps4
          for src in src/game.c src/main_ps4.c; do
            obj="build/ps4/$(basename "$src" .c).o"
            clang --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -c \
              -isysroot "$T" -isystem "$T/include" -Isrc -o "$obj" "$src"
          done
          ld.lld build/ps4/*.o -m elf_x86_64 -pie --script "$T/link.x" \
            --eh-frame-hdr -L"$T/lib" -lc -lkernel -lScePad -lSceUserService -lSceAudioOut \
            "$T/lib/crt1.o" -o build/ps4/bone-run.elf

          # Проверка, что это ELF
          MAGIC=$(od -An -tx1 -N4 build/ps4/bone-run.elf | tr -d " \n")
          if [ "$MAGIC" != "7f454c46" ]; then
            echo "ОШИБКА: bone-run.elf не ELF, первые байты: $MAGIC"
            exit 1
          fi

          # make_fself.py принимает только ET_EXEC или ET_SCE_*; stock ld.lld пишет ET_DYN (3).
          # Ставим ET_SCE_DYNAMIC (0xFE18), как делает линковщик OpenOrbis.
          python3 - build/ps4/bone-run.elf <<'PYEOF'
          import struct, sys
          p = sys.argv[1]
          b = bytearray(open(p, "rb").read())
          t = struct.unpack_from("<H", b, 16)[0]
          print("e_type before:", hex(t))
          if t == 3:
              struct.pack_into("<H", b, 16, 0xFE18)
              open(p, "wb").write(b)
          print("e_type after:", hex(struct.unpack_from("<H", b, 16)[0]))
          PYEOF

          python2.7 "$OO_PS4_TOOLCHAIN/scripts/make_fself.py" build/ps4/bone-run.elf build/ps4/eboot.bin \
            --paid 0x3800000000000011
          ls -la build/ps4/eboot.bin

      - name: Build PKG
        run: |
          set -e
          T="$OO_PS4_TOOLCHAIN"
          STAGE=build/ps4/stage
          rm -rf "$STAGE" && mkdir -p "$STAGE/sce_sys"
          cp build/ps4/eboot.bin "$STAGE/"
          cp pkg/sce_sys/param.sfo pkg/sce_sys/icon0.png "$STAGE/sce_sys/"
          python3 - "$CONTENT_ID" "$STAGE/pkg.gp4" <<'PYEOF'
          import sys
          content_id, out = sys.argv[1], sys.argv[2]
          gp4 = """<?xml version="1.0"?>
          <psproject fmt="gp4" version="1000">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>PS4VOLUME</volume_id>
              <volume_ts>2026-11-21 00:00:00</volume_ts>
              <package content_id="%s" passcode="00000000000000000000000000000000" storage_type="digital50" app_type="full" />
              <chunk_info chunk_count="1" scenario_count="1">
                <chunks><chunk id="0" layer_no="0" label="Chunk #0" /></chunks>
                <scenarios default_id="0">
                  <scenario id="0" type="sp" initial_chunk_count="1" label="Scenario #0">0</scenario>
                </scenarios>
              </chunk_info>
            </volume>
            <files img_no="0">
              <file targ_path="eboot.bin" orig_path="eboot.bin" />
              <file targ_path="sce_sys/param.sfo" orig_path="sce_sys/param.sfo" />
              <file targ_path="sce_sys/icon0.png" orig_path="sce_sys/icon0.png" />
            </files>
            <rootdir>
              <dir targ_name="sce_sys" />
            </rootdir>
          </psproject>
          """ % content_id
          open(out, "w", encoding="utf-8").write(gp4)
          print("gp4 written:", out)
          PYEOF
          cd "$STAGE"
          if [ -x "$T/bin/linux/PkgTool.Core" ]; then
            "$T/bin/linux/PkgTool.Core" pkg_build pkg.gp4 .
          else
            echo "PkgTool.Core не найден в образе OpenOrbis: PKG не собран."
            echo "Папка stage готова: eboot.bin, sce_sys/param.sfo, sce_sys/icon0.png, pkg.gp4"
          fi
          ls -la

      - name: Zip package
        run: |
          cd build/ps4/stage
          zip -r ../../../bone-run-ps4.zip .

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: bone-run-ps4
          path: bone-run-ps4.zip
